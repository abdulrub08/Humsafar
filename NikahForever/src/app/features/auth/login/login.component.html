  <div class="card shadow">
    <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary-nikah">Login Existing User Here! </h6>
    </div>
    <div class="card-body row">
      <div class="col-md-6" style="background-image: url(../../../../assets/profiles/banner1.jpg);background-size: cover; border-radius: 15px 0px 0px 15px;">
      </div>
      <div class="col-md-6">
        <div *ngIf="isLoading" style="text-align: center;">
          <app-loading-spinner></app-loading-spinner>
        </div>
        <p>Log in to continue learning, track progress, and unlock new content!</p>
        <div class="alert alert-danger" *ngIf="error">
          <p>{{ error }}</p>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" />
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Enter a valid email</mat-error>
          </mat-form-field>
      
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" />
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
            <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
              Minimum 6 characters required
            </mat-error>
          </mat-form-field>
      
          <div class="clear"></div>
          <div class="button-group">
            <button mat-raised-button color="primary" type="submit">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>
