<div class="profile-container">
    <h2 class="header">Your Recent Activity</h2>
    <div class="carousel">
      <button *ngIf="startIndex > 0" class="prev-btn" (click)="prev()">&#9665;</button>
      <div class="profile-list">
        <div *ngFor="let profile of visibleProfiles" class="profile-card" (mouseover)="hoverProfile=profile.id" (mouseleave)="hoverProfile=null">
          <div class="image-wrapper">
            <img [src]="profile.image" [alt]="profile.alt" class="profile-img" />
            <div class="watermark">VIP</div>
          </div>
          <div class="profile-info">
            <h3>{{ profile.name }}</h3>
            <p>{{ truncate(profile.role, 20) }}</p>
          </div>
          <button class="profile-button" *ngIf="hoverProfile === profile.id">View Profile</button>         
        </div>
      </div>
      <button *ngIf="startIndex + 5 < profiles.length" class="next-btn" (click)="next()">&#9655;</button>
    </div>
  </div>
