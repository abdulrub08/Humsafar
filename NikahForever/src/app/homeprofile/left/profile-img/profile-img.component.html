<div class="max-w-sm bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 text-center">
    <!-- Profile Image -->
    <img 
      class="w-24 h-24 rounded-full mx-auto border-4 border-gray-300 shadow-md" 
      src="https://randomuser.me/api/portraits/women/1.jpg" 
      alt="Profile Picture"
    />
  
    <!-- User Info -->
    <h2 class="mt-4 text-xl font-semibold text-gray-800 dark:text-white">
      Abdul Rub
    </h2>
    <p class="text-gray-500 dark:text-gray-400">Private Sector</p>
  
    <!-- Action Buttons -->
    <div class="mt-4 flex justify-center gap-4">
      <a 
        href="#" 
        class="flex items-center px-4 py-2 text-white bg-red-500 rounded-lg shadow-md hover:bg-red-600 transition"
      >
        <mat-icon class="mr-2">chat</mat-icon> MESSAGE
      </a>
  
      <a 
        href="#" 
        (click)="openSearchDialog($event)"
        class="flex items-center px-4 py-2 text-white bg-pink-500 rounded-lg shadow-md hover:bg-pink-600 transition"
      >
        <mat-icon class="mr-2">search</mat-icon> SEARCH
      </a>
    </div>
  </div>
